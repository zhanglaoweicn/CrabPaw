name: weather-data-source
version: "1.0.0"
kind: plugin
description: "天气数据源插件——数据源层插件托管: 启停对天气取数真实生效"
author: "CrabPaw Core"
license: MIT
lifecycle:
  start: onStart
  stop: onStop
platforms: [windows, linux, macos]
contributes:
  dataSources:
    - name: weather
      description: "天气(城市查询)"
      handler: datasource.js
