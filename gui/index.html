<!DOCTYPE html>
<html lang="zh-CN" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrabPaw</title>
    <!-- 2026-09-30 离线地基: 自托管 Inter 可变字体预取（单文件覆盖 400/600 字重）——
         与 fonts.css 的 font-display:swap 配合，保证首帧就用正确字体。此前走 Google Fonts：
         离线要等网络超时，且字体异步到达会让数字先以系统字体渲染再跳变。路径由 Vite 处理，
         运行时零网络请求。字体由 scripts/fetch-inter-fonts.js 生成。 -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./src/assets/fonts/inter-latin-var.woff2" />
    <!-- 2026-08-22 黑屏修复轮: 触发 vite full-reload 重建渲染管线 -->
    <script>
      (function() {
        var theme = localStorage.getItem('crabpaw_theme') || 'dark';
        document.documentElement.className = 'theme-' + theme;
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="splash-bootstrap" style="position:fixed;inset:0;background:#09090b;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999;">
        <div style="font-size:48px;margin-bottom:16px;">🦀</div>
        <div style="color:#71717a;font-size:14px;font-family:Inter,system-ui,sans-serif;letter-spacing:0.1em;">CrabPaw</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
<!-- HMR full-reload 14 -->
